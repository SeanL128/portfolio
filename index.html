<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sean Lindsay — CS @ Penn SEAS '30 · AI Systems · iOS Developer</title>
<style>
  :root {
    --bg: #0d0d0c;
    --text: #e8e6e1;
    --muted: #7a7873;
    --hair: #2a2926;
    --bright: #ffffff;
    --accent: #8a8f86; /* muted low-key gray-green; single control */
    --space: clamp(2.5rem, 6vh, 4.5rem);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    min-height: 100vh;
    padding: var(--space) clamp(2rem, 8vw, 7rem);
  }
  main {
    width: 100%;
    max-width: 1100px;
    margin: 0;
    display: grid;
    grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
    gap: clamp(3rem, 7vw, 6rem);
    align-items: start;
  }
  .col-left { position: sticky; top: var(--space); }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; gap: var(--space); }
    .col-left { position: static; }
  }

  /* Entrance: runs once, skipped under reduced-motion */
  .fade { opacity: 0; transform: translateY(6px); animation: rise .5s ease forwards; }
  .fade:nth-child(2) { animation-delay: .06s; }
  .fade:nth-child(3) { animation-delay: .12s; }
  .fade:nth-child(4) { animation-delay: .18s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade { opacity: 1; transform: none; animation: none; }
  }

  /* Header */
  .name {
    font-size: clamp(2rem, 6vw, 2.75rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--bright);
    margin: 0;
  }
  .ident {
    color: var(--muted);
    margin: .5rem 0 0;
    font-size: 1rem;
  }
  .focus {
    margin: 1rem 0 0;
    max-width: 30ch;
    color: var(--text);
    font-size: .95rem;
  }

  /* Section grammar */
  section { margin-top: var(--space); }
  .col-right > section:first-child { margin-top: 0; }
  .col-right > section:first-child .label { margin-top: .2rem; }
  .label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--accent);
    margin: 0 0 1.1rem;
    font-weight: 500;
  }

  /* Rows */
  .row {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: .95rem 0;
    border-top: 1px solid var(--hair);
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease;
  }
  .row:last-child { border-bottom: 1px solid var(--hair); }
  .row:hover, .row:focus-visible { transform: translateX(4px); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .row .title { color: var(--bright); font-weight: 400; }
  .row .desc { color: var(--muted); font-size: .95rem; margin-top: .15rem; }
  .row .main { flex: 1; min-width: 0; }
  .row .meta {
    color: var(--muted);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
    padding-top: .1rem;
  }
  .row .arrow { color: var(--accent); transition: color .15s ease; }
  .row:hover .arrow, .row:focus-visible .arrow { color: var(--bright); }
  .status { color: var(--accent); }

  /* Elsewhere links — stacked in the left rail */
  .links { display: flex; flex-direction: column; gap: .6rem; }
  .links a {
    color: var(--muted);
    text-decoration: none;
    transition: color .15s ease;
  }
  .links a:hover, .links a:focus-visible { color: var(--bright); }
  .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .links .arrow { color: var(--accent); }

  .cred {
    color: var(--text);
    margin: 0;
    padding: 0;
    list-style: none;
    columns: 2;
    column-gap: 2rem;
  }
  .cred li { padding: .3rem 0; break-inside: avoid; }
  .cred li::before { content: "— "; color: var(--muted); }
  @media (max-width: 460px) { .cred { columns: 1; } }
</style>
</head>
<body>
<main>
  <div class="col-left fade">
    <header>
      <h1 class="name">Sean Lindsay</h1>
      <p class="ident">CS @ Penn SEAS '30 · AI Systems · iOS Developer</p>
    </header>

    <section aria-labelledby="elsewhere-label">
      <h2 class="label" id="elsewhere-label">Elsewhere</h2>
      <nav class="links">
        <a href="https://github.com/SeanL128">GitHub <span class="arrow" aria-hidden="true">→</span></a>
      </nav>
    </section>
  </div>

  <div class="col-right fade">
    <section aria-labelledby="projects-label">
      <h2 class="label" id="projects-label">Projects</h2>

      <a class="row" href="https://apps.apple.com/us/app/sculpty-fitness-tracker/id6746368050">
        <span class="main">
          <span class="title">Sculpty</span>
          <span class="desc">iPhone app for tracking workouts, nutrition, and body measurements. Swift, SwiftUI. <span class="status">Live on the App Store.</span></span>
        </span>
        <span class="meta">iOS</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </div>
</main>
</body>
</html>
