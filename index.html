<!doctype html>

<title>Sean Lindsay — CS @ Penn SEAS '30 · AI Systems · iOS Developer</title>
<link rel="stylesheet" href="styles.css?v=2" />
<script>
  // Decide before first paint whether the build animation runs.
  (function () {
    var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var seen = false;
    try { seen = sessionStorage.getItem("built") === "1"; } catch (e) {}
    if (!reduced && !seen) document.documentElement.classList.add("building");
  })();
</script>
</head>
<body>
<main>
  <div class="col-left">
    <header data-build>
      <h1 class="name">Sean Lindsay</h1>
      <p class="ident">CS @ Penn SEAS '30 · AI Systems · iOS Developer</p>
    </header>

    <section aria-labelledby="elsewhere-label" data-build>
      <h2 class="label" id="elsewhere-label">Elsewhere</h2>
      <nav class="links">
        <a href="https://github.com/SeanL128">GitHub <span class="arrow" aria-hidden="true">→</span></a>
      </nav>
    </section>
  </div>

  <div class="col-right">
    <section aria-labelledby="projects-label">
      <h2 class="label" id="projects-label" data-build>Projects</h2>

      <a class="row" data-build href="https://apps.apple.com/us/app/sculpty-fitness-tracker/id6746368050">
        <span class="main">
          <span class="title">Sculpty</span>
          <span class="desc">iPhone app for tracking workouts, nutrition, and body measurements. Swift, SwiftUI. <span class="status">Live on the App Store.</span></span>
        </span>

</main>

<script src="robots.js?v=2" defer></script>
